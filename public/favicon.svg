<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0508" />
      <stop offset="50%" stop-color="#0f0204" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fca5a5" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <filter id="rShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#ef4444" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Ambient Glow -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#glow)" />

  <!-- Monogram R -->
  <text x="50%" y="53%" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="300" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="central" filter="url(#rShadow)">R</text>
</svg>
